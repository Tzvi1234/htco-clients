# Checks for every pull request and every push to main. Branch rules require one status,
# `ci-gate`, which passes only when every job below passed (ER-GIT-04). Actions are pinned to
# commit SHAs (scripts/check-action-pins.ts); jobs get only the permissions they need. Jobs for
# the web, Android and Windows apps join with their phases, behind path filters.
name: CI

on:
  pull_request:
    # `edited` re-runs the checks when the title or the "Test changes" section changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Lint and formatting
        run: pnpm run lint
      - name: Types
        run: pnpm run typecheck
      - name: Translations in sync and complete
        run: pnpm run i18n:check
      # The pinned OpenAPI copy is the platform's file at the commit in openapi.pin.json
      # (architecture audit finding 8.1; client ADR-0004).
      - name: Pinned OpenAPI matches its platform commit
        run: node scripts/openapi-pin.ts --check

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test

  # Slice 3.4: every Storybook story runs in Chromium (render, play-function interaction and
  # keyboard tests, axe), then every story is checked again in he/en × light/dark with axe and a
  # screenshot. It runs inside the Playwright image, pinned by digest, so screenshots render the
  # same on every run; a missing or changed screenshot fails and is uploaded for review.
  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Stories in a browser (interactions, keyboard, axe)
        run: pnpm run test:storybook
      - name: Build Storybook
        run: pnpm --filter @htco/web storybook:build
      - name: Every story in he/en × light/dark (axe, screenshots)
        run: pnpm --filter @htco/web exec playwright test --project components
      # New baselines written for missing screenshots, and actual/expected/diff images of changed
      # ones, to review and commit (docs/features/web-shell/operations.md).
      - name: Upload screenshots for review
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-screenshots
          path: |
            apps/web/e2e/**/__screenshots__/
            apps/web/test-results/**/*.png
          retention-days: 7

  # Slice 3.3 part 2: journeys through the app on its in-memory API (`?demo`), at 1440×900 and
  # 375×812, each stop checked with axe and a screenshot; same image as `storybook`.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Journeys (sign-in, MFA, language, theme, team, invitation, sign-out)
        run: pnpm --filter @htco/web exec playwright test --project journeys-desktop --project journeys-phone
      - name: Upload screenshots for review
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-screenshots
          path: |
            apps/web/e2e/**/__screenshots__/
            apps/web/test-results/**/*.png
          retention-days: 7

  web-build:
    name: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same build App Platform runs for the static site (client ADR-0006).
      - name: Build the web app's image
        run: docker build --file apps/web/Dockerfile --tag htco-web .
      - name: The built page carries its security policies
        run: |
          docker run --rm htco-web cat /src/apps/web/dist/index.html > index.html
          grep -q 'http-equiv="Content-Security-Policy"' index.html
          grep -q '<meta name="referrer" content="same-origin" />' index.html

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      OSV_SCANNER_VERSION: "2.6.0"
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Secrets in the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
      - name: Install osv-scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Known vulnerabilities in locked dependencies
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile pnpm-lock.yaml'

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.30.1 --min-severity low .github
      - name: Actions pinned by commit SHA
        run: node scripts/check-action-pins.ts

  test-integrity:
    name: test-integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Weakened tests need a "Test changes" explanation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/test-integrity.ts --base "$BASE_SHA"

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/conventional-commit.ts --title "$PR_TITLE"

  ci-gate:
    name: ci-gate
    if: always()
    needs: [checks, tests, storybook, e2e, web-build, security, workflows, test-integrity, pr-title]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          # Pull-request-only jobs are skipped on pushes to main; everything else must succeed.
          pull_request_only = {"test-integrity", "pr-title"}
          on_push = os.environ["EVENT_NAME"] != "pull_request"
          failed = {
              name: job["result"]
              for name, job in needs.items()
              if job["result"] != "success"
              and not (on_push and name in pull_request_only and job["result"] == "skipped")
          }
          for name, result in sorted(failed.items()):
              print(f"::error::{name}: {result}")
          sys.exit(1 if failed else 0)
          PY
